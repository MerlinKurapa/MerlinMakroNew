<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merlin Makro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid"></div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <div class="brand-title">Merlin Makro</div>
          <div class="brand-sub" id="user-email">...</div>
        </div>
      </div>
      <div class="top-status" id="top-status">Hazır</div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="item">⚔ Item</button>
      <button class="tab" data-tab="bag">🎒 Torba</button>
      <button class="tab" data-tab="skill">🎯 Skill</button>
      <button class="tab" data-tab="settings">⚙ Ayarlar</button>
    </nav>

    <main class="content">
      <section class="panel active" id="panel-item">
        <div class="panel-grid">
          <div class="card transparent">
            <h3>Item Kontrol</h3>
            <button class="action start" id="btn-item-start">▶ Item Başlat (F2)</button>
            <button class="action stop" id="btn-stop">■ Durdur</button>
            <label>Tekrar Sayısı</label>
            <input type="number" id="run-count" min="1" max="999" value="1" />
          </div>
          <div class="card coords transparent">
            <h3>Koordinatlar</h3>
            <div class="coord-toolbar">
              <button class="mini start" id="btn-add-coord" title="Koordinat Ekle">＋ Ekle</button>
              <button class="mini save" id="btn-save-coords" title="Kaydet">💾 Kaydet</button>
              <span class="live-coords" id="live-coords">X: 0, Y: 0</span>
            </div>
            <div id="coord-list"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-bag">
        <div class="card center-card">
          <h3>🎒 Torba Sistemi</h3>
          <button class="action start" id="btn-bag-toggle">▶ Torba Aç/Kapat (F3)</button>
          <button class="action stop" id="btn-bag-stop">■ Durdur</button>
        </div>
      </section>

      <section class="panel" id="panel-skill">
        <div class="card center-card">
          <h3>⚡ Skill Sistemi</h3>
          <button class="action start" id="btn-skill-toggle">▶ Skill Aç/Kapat (Num1)</button>
          <button class="action stop" id="btn-skill-stop">■ Durdur</button>
        </div>
      </section>

      <section class="panel" id="panel-settings">
        <div class="card settings-card">
          <h3>⚙ Ayarlar</h3>
          <div class="slider-group" id="sliders"></div>
          <div class="settings-actions">
            <button class="action save" id="btn-save-settings">💾 Makro Ayarlarını Kaydet</button>
            <button class="action" id="btn-reset-settings">↺ Eski Haline Döndür</button>
          </div>
          <div class="divider"></div>
          <div class="update-block">
            <h3>🔄 Güncelleme Kontrolü</h3>
            <button class="action" id="btn-check-update">🔍 Güncelleme Kontrol Et</button>
            <div id="update-status" class="update-status hidden"></div>
            <button class="action update-btn hidden" id="btn-download-update">⬇️ Güncellemeyi İndir</button>
          </div>
          <div class="divider"></div>
          <div class="logout-block">
            <button class="action danger" id="btn-logout">⎋ Çıkış Yap</button>
            <p class="hint">Çıkış yapınca oturum silinir ve launcher açılır.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span></span>
      <span class="rgb-text">MerlinMakro v5.7</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
